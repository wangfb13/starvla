# Usage:
#   lerobot-replay --config_path=examples/spark3_pose_gripper/replay.yaml

robot:
  type: spark3_pose_gripper
  id: spark3_follower
  state_topic: /wbc_state_pose
  command_topic: /wbc_goal_pose
  joint_state_topic: /joint_states
  connect_timeout_s: 10.0
  ros_node_name: lerobot_spark3_pose_gripper
  trigger_initial_pose_service: /trigger_initial_pose
  cameras:
    cam_top:
      type: OrbbecCamera
      serial_number: AY6G65300YN
      fps: 30
      width: 640
      height: 480
      use_depth: true
      intrinsics_file: ${HF_LEROBOT_HOME}/run_scripts/intrinsics_data/orbbec_intrinsics_AY6G65300YN_all_resolutions.json

    cam_right_wrist:
      type: wirstFisheyeX5
      x5_ip: 192.168.9.11
      fps: 30
      width: 1920
      height: 1080
      use_gpu_decode: true
      intrinsics_file: ${HF_LEROBOT_HOME}/run_scripts/intrinsics_data/camera_calibration_right_wrist.json

    cam_left_wrist:
      type: wirstFisheyeX5
      x5_ip: 192.168.9.10
      fps: 30
      width: 1920
      height: 1080
      use_gpu_decode: true
      intrinsics_file: ${HF_LEROBOT_HOME}/run_scripts/intrinsics_data/camera_calibration_left_wrist.json

    cam_right_gripper_tactile:
      type: dmTactileX5
      x5_ip: 192.168.9.11
      left_serial_number: X25510054
      right_serial_number: X25480028
      fps: 30
      width: 640
      height: 480

    cam_left_gripper_tactile:
      type: dmTactileX5
      x5_ip: 192.168.9.10
      left_serial_number: X25480014
      right_serial_number: X26040294
      fps: 30
      width: 640
      height: 480

  # Optional scalar/array ROS topics that should be exposed in observations.
  # sensors:
  #   left_force:
  #     topic: /left_force_sensor
  #     msg_type: float64_multi_array
  #     keys: [left_force.fx, left_force.fy, left_force.fz]

dataset:
  repo_id: spark3_pose_gripper_pick_block
  root: null
  episode: 0
  fps: 30

play_sounds: false
