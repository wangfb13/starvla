# Usage:
#   lerobot-teleoperate --config_path=examples/spark3_pose_gripper/teleoperate.yaml

teleop:
  type: spark3_pose_gripper
  id: spark3_teleop
  teleop_topic: /wbc_goal_pose_ee
  connect_timeout_s: 10.0
  ros_node_name: lerobot_spark3_pose_gripper_teleoperator

robot:
  type: spark3_pose_gripper
  id: spark3_follower
  state_topic: /wbc_state_pose
  command_topic: /wbc_goal_pose
  joint_state_topic: /joint_states
  connect_timeout_s: 10.0
  ros_node_name: lerobot_spark3_pose_gripper
  trigger_initial_pose_service: null #/trigger_initial_pose
  cameras:
    cam_top:
      type: OrbbecCamera
      serial_number: AY3794300HG
      fps: 30
      width: 640
      height: 480
      use_depth: false
      warmup_s: 5
      intrinsics_file: /home/cxzk/DM_das/lerobot-v0.5.0/src/lerobot/camera_intrinsic/orbbec_intrinsics_AY3794300HG_all_resolutions.json

